[project]
name = "airun-backend"
version = "0.1.0"
description = "AIRun backend - Garmin fitness data + AI coaching"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.5",
    "asyncpg>=0.32.0",
    "psycopg2-binary>=2.9.13",
    "alembic>=1.20.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "celery[redis]>=5.6.3",
    # kombu[redis] (зависимость Celery) не принимает redis>=6.5
    "redis>=6.4.0,<6.5",
    "cryptography>=50.0.2",
    "garminconnect>=0.3.19",
    "curl_cffi>=0.16.3",
    "ua-generator>=2.1.7",
    "google-genai>=2.31.0",
    "groq>=1.7.0",
    "PyJWT>=2.15.1",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
# Ruff 0.17 расширил набор по умолчанию. Проект по-прежнему проверяется E4, E7, E9, F.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
