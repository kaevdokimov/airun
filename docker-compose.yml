services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: airun
      POSTGRES_PASSWORD: airun
      POSTGRES_DB: airun
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airun"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airun:airun@postgres:5432/airun
      DATABASE_URL_SYNC: postgresql://airun:airun@postgres:5432/airun
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airun:airun@postgres:5432/airun
      DATABASE_URL_SYNC: postgresql://airun:airun@postgres:5432/airun
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.tasks worker --loglevel=info
    volumes:
      - ./backend:/app

  beat:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://airun:airun@postgres:5432/airun
      DATABASE_URL_SYNC: postgresql://airun:airun@postgres:5432/airun
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.tasks beat --loglevel=info
    volumes:
      - ./backend:/app

  bot:
    build: ./bot
    env_file: .env
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
      - redis
    volumes:
      - ./bot:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    env_file: .env
    depends_on:
      - api
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data:
